services:
  sidemind-api:
    cwd: web
    command: npm run dev:server
    port: 3001
    health: /api/notes
    env:
      SIDEMIND_DATA_DIR: ../.amp/preview-data
      SIDEMIND_CONFIG_DIR: ../.amp/preview-config
  sidemind-web:
    cwd: web
    command: npm run dev:web -- --host 127.0.0.1 --port "$PORT" --strictPort
    port: 5173
    health: /api/notes
    portal:
      title: Sidemind
      description: 独立的示例笔记工作区，不读取你电脑上的文件。ChatGPT 登录请在本机运行应用后使用。

services:
  chatgit:
    # The Amp-authenticated owner enters the same account-free workspace via Web Portal.
    # Isolate preview data; never adopt an existing account-mode database.
    command: CHATGIT_LOCAL_MODE=true CHATGIT_STATE_DIR="$PWD/.chatgit/local-preview" npm run dev -- --port "$PORT"
    port: 32251
    health: /health
    env:
      CHATGIT_PORTAL_MODE: "true"
      CSP_FRAME_ANCESTORS: "'self' https://ampcode.com"
    portal:
      url: /api/local/portal
      title: ChatGit
      description: Direct web preview. Your Amp identity opens your private workspace; no ChatGit signup required.

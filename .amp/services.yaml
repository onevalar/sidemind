services:
  chatgit:
    # Preview the actual account-free local app, not the upstream account mode.
    # Open .amp/open-chatgit.sh in the Desktop portal after starting this service.
    # Isolate preview data; never adopt an existing account-mode database.
    command: CHATGIT_LOCAL_MODE=true CHATGIT_STATE_DIR="$PWD/.chatgit/local-preview" npm run dev -- --port "$PORT"
    # Keep the existing public 23183 proxy connected to this local service.
    port: 32251
    health: /health
